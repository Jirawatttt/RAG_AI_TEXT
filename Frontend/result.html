<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Rights Viewer</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .content-area {
      flex: 1; padding: 36px 32px;
      max-width: 900px; width: 100%; margin: 0 auto;
    }

    /* ── Action bar ── */
    .action-bar {
      display: flex; gap: 10px;
      justify-content: flex-end; margin-bottom: 20px;
    }
    .icon-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-family: 'Sarabun', sans-serif; font-size: 0.85rem;
      font-weight: 600; color: var(--navy); cursor: pointer; transition: all 0.2s;
    }
    .icon-btn:hover { background: var(--surface); border-color: var(--navy-light); }
    .icon-btn:disabled { cursor: wait; opacity: .5; }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn.copied { background: #E8F8F0; border-color: #1D9E75; color: #1D9E75; }

    .disclaimer {
      font-size: 0.82rem; color: var(--text-muted); margin-top: 24px;
      padding: 12px 16px; background: #fff; border: 1px solid var(--border);
      border-radius: 8px; border-left: 3px solid var(--gold);
    }
    .footer-actions { justify-content: center; }
    .no-result-box { text-align: center; padding: 48px 24px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; }
    .no-result-icon { width: 56px; height: 56px; background: #FFF4E5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .no-result-heading { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .no-result-sub { font-size: 0.92rem; color: var(--text-sub); line-height: 1.7; }
    .header-logo { width: 36px; height: 36px; object-fit: contain; filter: brightness(0) invert(1); }

    /* ── RAG-first result view ── */
    .rag-hero { background: linear-gradient(135deg, #11264e, #245a9b); color: #fff; border-radius: 16px; padding: 30px; margin-bottom: 22px; box-shadow: 0 10px 26px rgba(27,58,107,.18); }
    .rag-kicker { color: #f3cf7a; letter-spacing: .14em; font-size: .72rem; font-weight: 700; margin-bottom: 8px; }
    .rag-hero h2 { font-size: 1.35rem; margin: 0 0 8px; }
    .rag-hero p { margin: 0; opacity: .84; line-height: 1.65; }
    .rag-hero-loading { min-height: 174px; display: flex; flex-direction: column; justify-content: center; }
    .rag-loading { display: flex; gap: 7px; margin-top: 20px; }
    .rag-loading span { width: 8px; height: 8px; border-radius: 100%; background: #f3cf7a; animation: pulse 1.1s infinite; }
    .rag-loading span:nth-child(2) { animation-delay: .15s; }.rag-loading span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 50% { opacity: .25; transform: translateY(-3px); } }
    .rag-results { display: grid; gap: 16px; }
    .rag-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: 0 3px 12px rgba(27,58,107,.07); }
    .rag-card-top { display: flex; align-items: center; gap: 9px; color: var(--navy); font-size: .76rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }.rag-card-top span { color: #fff; background: var(--navy); border-radius: 50%; width: 27px; height: 27px; display: grid; place-items: center; }.rag-card-top p { margin: 0; }
    .rag-card h3 { margin: 13px 0 16px; color: var(--text-main); font-size: 1.16rem; }.rag-answer { background: #f2f6fc; border-left: 4px solid var(--gold); border-radius: 7px; padding: 15px 16px; }.rag-answer-label, .rag-card h4 { font-size: .72rem; color: var(--navy); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; margin: 0 0 7px; }.rag-answer p { color: var(--text-sub); white-space: pre-line; line-height: 1.75; margin: 0; }
    .benefit-facts { margin-top: 18px; padding: 16px; background: #fafbfd; border: 1px solid var(--border); border-radius: 8px; }.benefit-facts h4 { margin-bottom: 12px; }.benefit-facts dl { display: grid; grid-template-columns: 150px 1fr; gap: 10px 16px; margin: 0; font-size: .9rem; }.benefit-facts dt { color: var(--text-muted); font-weight: 600; }.benefit-facts dd { color: var(--text-sub); margin: 0; line-height: 1.6; }.benefit-facts dd p, .benefit-facts dd ul { margin: 0; padding-left: 18px; }.benefit-facts dd a { color: var(--navy-light); font-weight: 700; }
    .more-rights { margin-top: 20px; padding: 20px 22px; background: #f2f6fc; border: 1px solid var(--border); border-radius: 12px; }.more-rights h3 { color: var(--navy); font-size: 1rem; margin: 0 0 6px; }.more-rights p { color: var(--text-sub); margin: 0 0 14px; line-height: 1.6; }
    .rag-check-note { color: var(--text-muted); font-size: .84rem; line-height: 1.6; margin: 17px 0 0; }
    .rag-footer { border-top: 1px solid var(--border); padding-top: 13px; display: flex; justify-content: space-between; gap: 15px; color: var(--text-muted); font-size: .83rem; }.rag-footer a { color: var(--navy-light); font-weight: 700; white-space: nowrap; }

    @media print {
      .app-header, .footer-actions, .action-bar { display: none !important; }
      .content-area { padding: 0; max-width: 100%; }
      body { background: #fff; }
    }
    @media (max-width: 576px) {
      .rag-card, .rag-hero { padding: 20px; }.rag-footer { flex-direction: column; }.benefit-facts dl { grid-template-columns: 1fr; gap: 4px; }.benefit-facts dd { margin-bottom: 8px; }
      .content-area { padding: 24px 16px; }
      .action-bar { justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div class="app-header">
    <a href="input.html">
      <img src="logo.png" alt="Smart Rights Viewer" class="header-logo" />
    </a>
    <h1>ผลการตรวจสอบสิทธิ</h1>
    <div class="header-spacer"></div>
  </div>

  <div class="content-area">

    <div class="action-bar">
      <button class="icon-btn" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/>
        </svg>
        พิมพ์ / บันทึก PDF
      </button>
      <button class="icon-btn" id="copy-btn" onclick="copyResults()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        คัดลอกผลลัพธ์
      </button>
    </div>

    <div id="result-content"></div>

    <p class="disclaimer">
      * หมายเหตุ: ผลที่แสดงเป็นการประเมินเบื้องต้นเท่านั้น
      กรุณาติดต่อหน่วยงานที่เกี่ยวข้องเพื่อยืนยันสิทธิอย่างเป็นทางการ
    </p>
  </div>

  <div class="footer-actions">
    <a class="btn-action primary" href="input.html">ตรวจสอบอีกครั้ง</a>
  </div>

  <script src="app.js"></script>
  <script>
    let currentBenefits = [];

    window.addEventListener("DOMContentLoaded", () => {
      const raw = sessionStorage.getItem("analysis");
      if (raw) {
        try {
          const analysis = JSON.parse(raw);
          currentBenefits = analysis.benefits || [];
          renderAnalysis(analysis);
          return;
        } catch (error) {
          console.warn("Stored analysis is invalid:", error);
          sessionStorage.removeItem("analysis");
        }
      }

      if (!sessionStorage.getItem("userProfileText")) {
        window.location.href = "input.html";
        return;
      }
      loadTextAnalysis();
    });

    function copyResults() {
      if (currentBenefits.length === 0) return;
      let text = `ผลการวิเคราะห์สิทธิประโยชน์ภาครัฐเบื้องต้น\nพบรายการ ${currentBenefits.length} รายการ\n${"=".repeat(40)}\n\n`;
      currentBenefits.forEach((b, i) => {
        text += `${i + 1}. ${b.name}\n`;
        text += `   สถานะ: ${b.status}\n`;
        text += `   ${b.explanation}\n`;
        text += `   ตรวจเพิ่ม: ${(b.missing_information || []).join(", ") || "-"}\n\n`;
      });
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copy-btn");
        const ori = btn.innerHTML;
        btn.classList.add("copied");
        btn.innerHTML = "✓ คัดลอกแล้ว";
        setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = ori; }, 2000);
      });
    }
  </script>
</body>
</html>
